<h2>近日营收放哪种更顺手？</h2>
<p class="subtitle">默认显示昨天，点击卡片后选择今天往前 15 天内的某一天。</p>

<div class="cards">
  <div class="card" data-choice="a" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup">
        <div class="mockup-header">方案 A：双主卡并排</div>
        <div class="mockup-body" style="background:#f7f8fc;padding:18px;border-radius:18px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div style="border-radius:18px;padding:18px;background:linear-gradient(145deg,#ff7a00,#ff5a00);color:#fff;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;">
              <div>
                <div style="font-size:13px;opacity:.9;">今日营收</div>
                <div style="font-size:34px;font-weight:800;margin-top:10px;">¥1497</div>
              </div>
              <div style="font-size:12px;opacity:.86;">点击查看完整经营看板</div>
            </div>
            <div style="border-radius:18px;padding:18px;background:linear-gradient(145deg,#fff6d8,#f5e4aa);color:#2f2a26;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(201,165,63,.18);">
              <div>
                <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">
                  <div style="font-size:13px;">近日营收</div>
                  <div style="font-size:11px;color:#7c5f22;background:rgba(255,255,255,.55);padding:3px 8px;border-radius:999px;">4月22日</div>
                </div>
                <div style="font-size:30px;font-weight:800;margin-top:10px;">¥1328</div>
              </div>
              <div style="font-size:12px;color:#7c6f5c;">点击切换日期</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>方案 A</h3>
      <p>和今日营收并排，层级最强，第一眼就能对比今天和最近某天。</p>
    </div>
  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup">
        <div class="mockup-header">方案 B：主卡 + 辅助条</div>
        <div class="mockup-body" style="background:#f7f8fc;padding:18px;border-radius:18px;">
          <div style="border-radius:18px;padding:18px;background:linear-gradient(145deg,#ff7a00,#ff5a00);color:#fff;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;">
            <div>
              <div style="font-size:13px;opacity:.9;">今日营收</div>
              <div style="font-size:34px;font-weight:800;margin-top:10px;">¥1497</div>
            </div>
            <div style="font-size:12px;opacity:.86;">点击查看完整经营看板</div>
          </div>
          <div style="margin-top:12px;border-radius:16px;padding:14px 16px;background:#fff;border:1px solid #eee2b6;display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-size:13px;color:#6b5a35;">近日营收</div>
              <div style="font-size:12px;color:#9b8c68;margin-top:4px;">4月22日</div>
            </div>
            <div style="font-size:26px;font-weight:800;color:#2f2a26;">¥1328</div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>方案 B</h3>
      <p>保留今日营收的主视觉，近日营收作为辅助信息，改动更小。</p>
    </div>
  </div>
</div>
